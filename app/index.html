<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StatsFútbol</title>
  <meta name="description" content="Anotá tus partidos, goles, asistencias y seguí tu carrera de jugador.">
  <meta name="theme-color" content="#0b0f0d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    try { const t = localStorage.getItem('sf:theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <nav class="nav" id="nav" aria-label="Secciones">
      <a class="nav-brand" href="#/inicio" aria-label="StatsFútbol">
        <img src="icons/icon.svg" alt="" width="34" height="34">
        <span>Stats<b>Fútbol</b></span>
      </a>
      <div class="nav-items" id="nav-items"></div>
    </nav>
    <div class="main">
      <header class="topbar" id="topbar">
        <div class="tb-left" id="tb-left"></div>
        <h1 class="tb-title" id="tb-title"></h1>
        <div class="tb-right">
          <span class="sync" id="sync" title=""></span>
          <a href="#/ajustes" class="avatar-btn" id="tb-avatar" aria-label="Cuenta y ajustes"></a>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
    <button class="fab" id="fab" type="button" hidden></button>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
